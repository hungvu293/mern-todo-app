global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
    metric_relabel_configs:
      - source_labels:
          - __name__
        regex: "node_cpu_seconds_total|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes"
        action: keep
